<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思口语笔记</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #2c3e50;
    --accent: #2f5d8c;
    --border: #e3e6ea;
    --quote-bg: #eef3f9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 26px 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  header h1 { font-size: 25px; font-weight: 600; }
  header p { opacity: 0.85; font-size: 14px; margin-top: 6px; }
  nav {
    max-width: 860px;
    margin: 16px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  nav a {
    text-decoration: none;
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 14px;
  }
  nav a.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar {
    max-width: 860px;
    margin: 14px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input[type="text"] {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }
  .toolbar input[type="text"]:focus { border-color: var(--accent); }
  .btn {
    padding: 9px 16px;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .who { font-size: 13px; color: #6b7a8c; }
  #error {
    max-width: 860px;
    margin: 20px auto;
    padding: 14px 20px;
    background: #fdecea;
    color: #b3261e;
    border-radius: 8px;
    display: none;
  }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%);
    background: #2c3e50;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 60;
  }
  #toast.show { opacity: 1; }
  main { max-width: 860px; margin: 18px auto 60px; padding: 0 16px; }
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 32px;
    margin-bottom: 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .section-card h2 {
    font-size: 21px;
    margin: 0 0 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-card h2 .arrow {
    font-size: 14px;
    color: #999;
    transition: transform 0.2s;
    display: inline-block;
  }
  .section-card.collapsed .arrow { transform: rotate(-90deg); }
  .section-card.collapsed .section-body { display: none; }
  .section-body { margin-top: 12px; }
  h3 {
    font-size: 17px;
    margin: 22px 0 8px;
    padding: 10px 14px;
    background: #f2f6fb;
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }
  h3:first-child { margin-top: 6px; }
  p { margin: 8px 0; }
  ul { margin: 8px 0 8px 22px; }
  li { margin: 4px 0; }
  strong { color: #1e4266; }
  blockquote {
    margin: 12px 0;
    padding: 10px 16px;
    background: var(--quote-bg);
    border-left: 4px solid #8fb3d9;
    border-radius: 0 8px 8px 0;
    color: #4c5b6b;
    font-size: 15px;
  }
  .editor-wrap { display: none; }
  .editor-wrap.active { display: block; }
  .editor-wrap textarea {
    width: 100%;
    min-height: 60vh;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    line-height: 1.7;
    resize: vertical;
    outline: none;
  }
  .editor-wrap textarea:focus { border-color: var(--accent); }
  .editor-actions { display: flex; gap: 10px; margin-bottom: 12px; }
  .modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,30,40,0.45);
    align-items: center;
    justify-content: center;
    z-index: 80;
  }
  .modal-mask.active { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 26px 26px 20px;
    width: 320px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .modal h3 { margin: 0 0 14px; padding: 0; background: none; border: none; font-size: 18px; }
  .modal label { display: block; font-size: 13px; color: #6b7a8c; margin: 10px 0 4px; }
  .modal input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .modal-error { color: #b3261e; font-size: 13px; min-height: 18px; margin-top: 8px; }
  footer { text-align: center; color: #999; font-size: 13px; margin: 40px 0 20px; }
  @media (max-width: 600px) {
    .section-card { padding: 18px; }
    header h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<header>
  <h1>雅思口语笔记</h1>
  <p>来源：ielts/notes.md · 内容实时加载</p>
</header>
<nav>
  <a href="/web/index.html">学习笔记（十三哥）</a>
  <a href="/ielts/index.html" class="active">雅思口语</a>
</nav>
<div class="toolbar">
  <input type="text" id="search" placeholder="搜索题目、表达或回答...">
  <span class="who" id="who"></span>
  <button class="btn" id="loginBtn">登录</button>
  <button class="btn" id="editBtn" disabled>编辑</button>
</div>
<div id="error"></div>
<main>
  <div class="editor-wrap" id="editorWrap">
    <div class="editor-actions">
      <button class="btn primary" id="saveBtn">保存</button>
      <button class="btn" id="cancelBtn">取消</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div id="app"><div class="section-card">加载中...</div></div>
</main>
<footer>使用 marked.js 渲染 Markdown</footer>

<div class="modal-mask" id="loginMask">
  <div class="modal">
    <h3>管理员登录</h3>
    <label for="username">用户名</label>
    <input type="text" id="username" autocomplete="username">
    <label for="password">密码</label>
    <input type="password" id="password" autocomplete="current-password">
    <div class="modal-error" id="loginError"></div>
    <div class="modal-actions">
      <button class="btn" id="loginCancel">取消</button>
      <button class="btn primary" id="loginSubmit">登录</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/web/marked.min.js"></script>
<script>
(function () {
  const NOTE_PATH = 'ielts/notes.md';
  const app = document.getElementById('app');
  const errorBox = document.getElementById('error');
  const searchInput = document.getElementById('search');
  const loginBtn = document.getElementById('loginBtn');
  const editBtn = document.getElementById('editBtn');
  const whoEl = document.getElementById('who');
  const editorWrap = document.getElementById('editorWrap');
  const editor = document.getElementById('editor');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const loginMask = document.getElementById('loginMask');
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const loginError = document.getElementById('loginError');
  const loginSubmit = document.getElementById('loginSubmit');
  const loginCancel = document.getElementById('loginCancel');
  const toastEl = document.getElementById('toast');

  marked.setOptions({ breaks: true, gfm: true });

  let blocks = [];
  let rawMarkdown = '';
  let editing = false;

  const token = {
    get() { return sessionStorage.getItem('ielts_token') || ''; },
    set(value) { sessionStorage.setItem('ielts_token', value); },
    clear() { sessionStorage.removeItem('ielts_token'); }
  };

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function showError(message) {
    errorBox.style.display = 'block';
    errorBox.textContent = message;
  }

  function clearError() {
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }

  function splitBlocks(text) {
    const result = [];
    let current = null;
    for (const line of text.split('\n')) {
      if (/^## /.test(line)) {
        if (current) result.push(current);
        current = { title: line.replace(/^##\s*/, ''), lines: [] };
      } else if (/^# /.test(line)) {
        continue;
      } else if (current) {
        current.lines.push(line);
      }
    }
    if (current) result.push(current);
    return result;
  }

  function render(filter) {
    app.innerHTML = '';
    const f = (filter || '').toLowerCase();
    const matched = blocks
      .map(b => ({ title: b.title, text: b.lines.join('\n') }))
      .filter(b => !f || (b.title + b.text).toLowerCase().includes(f));

    if (matched.length === 0) {
      app.innerHTML = '<div class="section-card">没有匹配的内容</div>';
      return;
    }

    for (const b of matched) {
      const card = document.createElement('div');
      card.className = 'section-card';
      const h2 = document.createElement('h2');
      h2.innerHTML = '<span class="arrow">▼</span>' +
        marked.parse(b.title).replace(/^<p>|<\/p>$/g, '');
      const body = document.createElement('div');
      body.className = 'section-body';
      body.innerHTML = marked.parse(b.text);
      h2.addEventListener('click', () => card.classList.toggle('collapsed'));
      card.appendChild(h2);
      card.appendChild(body);
      app.appendChild(card);
    }
  }

  async function loadNote() {
    clearError();
    try {
      const res = await fetch('/api/note?path=' + encodeURIComponent(NOTE_PATH) + '&t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      rawMarkdown = data.content || '';
      blocks = splitBlocks(rawMarkdown);
      render(searchInput.value);
    } catch (e) {
      app.innerHTML = '';
      showError('无法加载雅思笔记：' + e.message);
    }
  }

  function syncAuthUI() {
    const loggedIn = !!token.get();
    whoEl.textContent = loggedIn ? '已登录：admin' : '';
    loginBtn.textContent = loggedIn ? '退出' : '登录';
    loginBtn.classList.toggle('primary', !loggedIn);
    editBtn.disabled = !loggedIn;
    if (!loggedIn && editing) exitEdit();
  }

  function enterEdit() {
    editing = true;
    editor.value = rawMarkdown;
    editorWrap.classList.add('active');
    app.style.display = 'none';
    editBtn.textContent = '编辑中';
    editBtn.disabled = true;
    searchInput.disabled = true;
  }

  function exitEdit() {
    editing = false;
    editorWrap.classList.remove('active');
    app.style.display = '';
    editBtn.textContent = '编辑';
    editBtn.disabled = !token.get();
    searchInput.disabled = false;
  }

  async function save() {
    saveBtn.disabled = true;
    try {
      const res = await fetch('/api/note', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token.get()
        },
        body: JSON.stringify({ path: NOTE_PATH, content: editor.value })
      });
      if (res.status === 401) {
        token.clear();
        syncAuthUI();
        throw new Error('登录已失效，请重新登录');
      }
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.error || ('HTTP ' + res.status));
      }
      exitEdit();
      await loadNote();
      toast('已保存');
    } catch (e) {
      toast('保存失败：' + e.message);
    } finally {
      saveBtn.disabled = false;
    }
  }

  async function login() {
    loginError.textContent = '';
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) {
      loginError.textContent = '请输入用户名和密码';
      return;
    }
    loginSubmit.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        loginError.textContent = data.error || '登录失败';
        return;
      }
      token.set(data.token);
      loginMask.classList.remove('active');
      passwordEl.value = '';
      syncAuthUI();
      toast('登录成功');
    } catch (e) {
      loginError.textContent = '网络错误，请重试';
    } finally {
      loginSubmit.disabled = false;
    }
  }

  loginBtn.addEventListener('click', async () => {
    if (token.get()) {
      await fetch('/api/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token.get() }
      }).catch(() => {});
      token.clear();
      syncAuthUI();
      toast('已退出登录');
      return;
    }
    usernameEl.value = '';
    passwordEl.value = '';
    loginError.textContent = '';
    loginMask.classList.add('active');
    usernameEl.focus();
  });

  loginSubmit.addEventListener('click', login);
  loginCancel.addEventListener('click', () => loginMask.classList.remove('active'));
  passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  usernameEl.addEventListener('keydown', e => { if (e.key === 'Enter') passwordEl.focus(); });

  editBtn.addEventListener('click', enterEdit);
  saveBtn.addEventListener('click', save);
  cancelBtn.addEventListener('click', () => {
    if (editor.value !== rawMarkdown && !confirm('放弃未保存的修改？')) return;
    exitEdit();
  });

  editor.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') {
      e.preventDefault();
      save();
    }
  });

  searchInput.addEventListener('input', e => render(e.target.value));

  syncAuthUI();
  loadNote();
})();
</script>
</body>
</html>
