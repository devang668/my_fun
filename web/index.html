<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习笔记</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #2c3e50;
    --accent: #4a7c59;
    --border: #e3e6ea;
    --quote-bg: #f0f4f1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  header h1 { font-size: 26px; font-weight: 600; }
  header p { opacity: 0.85; font-size: 14px; margin-top: 6px; }
  .toolbar {
    max-width: 860px;
    margin: 18px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 10px;
  }
  .toolbar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }
  .toolbar input:focus { border-color: var(--accent); }
  nav {
    max-width: 860px;
    margin: 16px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  nav a {
    text-decoration: none;
    color: var(--accent);
    background: #fff;
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 14px;
  }
  nav a.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #error {
    max-width: 860px;
    margin: 20px auto;
    padding: 14px 20px;
    background: #fdecea;
    color: #b3261e;
    border-radius: 8px;
    display: none;
  }
  main { max-width: 860px; margin: 20px auto 60px; padding: 0 16px; }
  .content {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 34px 38px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  h1 { font-size: 28px; margin-bottom: 20px; }
  h2 {
    font-size: 22px;
    margin: 30px 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
  }
  h3 { font-size: 18px; margin: 24px 0 10px; color: var(--accent); }
  p { margin: 10px 0; }
  strong { color: #1a5230; }
  blockquote {
    margin: 14px 0;
    padding: 12px 18px;
    background: var(--quote-bg);
    border-left: 4px solid var(--accent);
    border-radius: 0 8px 8px 0;
    color: #4c5b52;
    font-size: 15px;
  }
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px 32px;
    margin-bottom: 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .section-card h2 {
    margin-top: 0;
    border-bottom: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-card h2 .arrow {
    font-size: 14px;
    color: #999;
    transition: transform 0.2s;
    display: inline-block;
  }
  .section-card.collapsed .arrow { transform: rotate(-90deg); }
  .section-card.collapsed .section-body { display: none; }
  footer {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin: 40px 0 20px;
  }
  @media (max-width: 600px) {
    .content, .section-card { padding: 20px; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>学习笔记</h1>
  <p>笔记来源：Bei-ming/note.md · 内容实时加载</p>
</header>
<nav>
  <a href="/web/index.html" class="active">学习笔记（十三哥）</a>
  <a href="/ielts/index.html">雅思口语</a>
</nav>
<div class="toolbar">
  <input type="text" id="search" placeholder="搜索笔记内容...">
</div>
<div id="error"></div>
<main id="app">
  <div class="content" id="content">加载中...</div>
</main>
<footer>使用 marked.js 渲染 Markdown</footer>

<script src="marked.min.js"></script>
<script>
(async function () {
  const errorBox = document.getElementById('error');
  const contentEl = document.getElementById('content');
  const app = document.getElementById('app');
  const searchInput = document.getElementById('search');

  marked.setOptions({ breaks: true, gfm: true });

  let rawMarkdown = '';
  try {
    const res = await fetch('../Bei-ming/note.md?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    rawMarkdown = await res.text();
    if (!rawMarkdown.trim()) throw new Error('笔记内容为空');
  } catch (e) {
    contentEl.style.display = 'none';
    errorBox.style.display = 'block';
    errorBox.textContent = '无法加载笔记：' + e.message +
      '（请通过本地服务器访问本页面，直接双击打开会因浏览器安全策略无法读取文件）';
    return;
  }

  // 按二级标题拆分为独立卡片
  const lines = rawMarkdown.split('\n');
  const blocks = [];
  let current = null;
  let docTitle = '';
  for (const line of lines) {
    if (/^# /.test(line) && !docTitle) {
      docTitle = line.replace(/^#\s*/, '');
      continue;
    }
    if (/^## /.test(line)) {
      if (current) blocks.push(current);
      current = { title: line.replace(/^##\s*/, ''), lines: [] };
    } else if (current) {
      current.lines.push(line);
    }
  }
  if (current) blocks.push(current);

  function render(filter) {
    app.innerHTML = '';
    const f = (filter || '').toLowerCase();
    const matched = blocks.map(b => ({ ...b, text: b.lines.join('\n') }))
      .filter(b => !f || (b.title + b.text).toLowerCase().includes(f));
    if (matched.length === 0) {
      app.innerHTML = '<div class="content">没有匹配的笔记内容</div>';
      return;
    }
    for (const b of matched) {
      const card = document.createElement('div');
      card.className = 'section-card';
      const h2 = document.createElement('h2');
      h2.innerHTML = '<span class="arrow">▼</span>' +
        marked.parse(b.title).replace(/^<p>|<\/p>$/g, '');
      const body = document.createElement('div');
      body.className = 'section-body';
      body.innerHTML = marked.parse(b.lines.join('\n'));
      h2.addEventListener('click', () => card.classList.toggle('collapsed'));
      card.appendChild(h2);
      card.appendChild(body);
      app.appendChild(card);
    }
  }

  searchInput.addEventListener('input', e => render(e.target.value));
  render('');
})();
</script>
</body>
</html>
